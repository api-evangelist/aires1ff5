x-api-posture-note: >-
  iris-amoi.com is a brochure site (ASP.NET WebForms, ICP 闽ICP备2023002281号-1). Every page in its
  sitemap is marketing copy; there is no developer, docs or API subdomain (api. and developer.
  resolve to the same wildcard CNAME as the apex and answer with the same site), and the host
  soft-404s — every unknown path, including a control path that cannot exist, returns HTTP 200
  with a 5-byte "[404]" text/html body — so no 200 from this host is evidence of a document.
  Contract discovery (openapi.json, swagger.json, api-docs, llms.txt, every /.well-known/ path,
  agent-card.json and agent.json) all returned that same soft-404 stub.
