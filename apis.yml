aid: aires1ff5
name: Aires (IRIS Xiamen Science)
description: >-
  Aires is the EquityZen listing name for 爱睿思（厦门）科技有限公司 — IRIS (Xiamen) Science Co., Ltd.
  (ISC), a contact-lens research, development and manufacturing company founded in 2020 in Tong'an
  District, Xiamen, China. It runs a fully automated colour contact lens factory (22,500 m² phase-one
  plant, RMB 600 million-plus investment) with in-house-designed equipment, automated optical inspection
  and sterile filling, and sells 38% and 55%
  water-content daily and semi-annual clear and colour lenses as ODM/OEM contract manufacturing —
  lens and pattern design, licensing support, logistics — to consumer brands. Built as the captive
  supply chain of the moody colour-lens brand, it holds high-tech enterprise certification and 18
  patents, and closed a RMB 100 million-plus B+ round led by Qianqi Capital in March 2026. It is a
  physical-goods manufacturer: iris-amoi.com is a Chinese-language brochure site with no developer
  program, API, SDK, webhook surface or machine-readable specification of any kind.
